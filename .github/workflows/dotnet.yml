name: Validate .NET
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: belrestroot
          MYSQL_DATABASE: belrestaurante
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pbelrestroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore BelemRestaurantes.sln
      - name: Build (Release)
        run: dotnet build BelemRestaurantes.sln -c Release --no-restore
      - name: Unit Tests
        run: dotnet test tests/BelemRestaurantes.UnitTests/BelemRestaurantes.UnitTests.csproj -c Release --no-build
      - name: Integration Tests
        env:
          BELRESTAURANTES_TEST_MYSQL: "Server=127.0.0.1;Port=3307;Database=belrestaurante;User ID=root;Password=belrestroot;SslMode=Required;"
        run: dotnet test tests/BelemRestaurantes.IntegrationTests/BelemRestaurantes.IntegrationTests.csproj -c Release --no-build