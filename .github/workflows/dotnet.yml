name: Validate .NET
on: [push, pull_request]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: belrestroot
          MYSQL_DATABASE: belrestaurante
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pbelrestroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Validate resumable public-data collector
        run: python3 scripts/test-food-registry.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore BelemRestaurantes.sln
      - name: Build (Release)
        run: dotnet build BelemRestaurantes.sln -c Release --no-restore
      - name: Unit Tests
        run: dotnet test tests/BelemRestaurantes.UnitTests/BelemRestaurantes.UnitTests.csproj -c Release --no-build
      - name: Integration Tests
        env:
          BELRESTAURANTES_TEST_MYSQL: "Server=127.0.0.1;Port=3307;Database=belrestaurante;User ID=root;Password=belrestroot;SslMode=Required;"
        run: |
          # O shell padrão do Actions em Linux é bash -e (errexit): sem o "|| rc=$?", um dotnet test
          # vermelho encerraria o script antes de capturar o código e a tag ci-log jamais seria publicada.
          rc=0
          dotnet test tests/BelemRestaurantes.IntegrationTests/BelemRestaurantes.IntegrationTests.csproj -c Release --no-build --logger "console;verbosity=detailed" > ci-integration.log 2>&1 || rc=$?
          failed=$(grep -oE 'BelemRestaurantes\.IntegrationTests\.[A-Za-z0-9_.]+ \[FAIL\]' ci-integration.log | sort -u)
          n=$(printf '%s' "$failed" | grep -c . || true)
          {
            echo "### Failing integration tests ($n)"
            printf '%s\n' "$failed"
            echo
            echo "### First error messages"
            grep -E -A 3 'Error Message|Mensagem de erro' ci-integration.log | head -c 8000
            echo
            echo "### Log tail"
            tail -n 40 ci-integration.log
          } > ci-diagnostic.txt
          cat ci-diagnostic.txt
          if [ "$rc" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -d ci-log >/dev/null 2>&1 || true
            git tag -a ci-log HEAD -F ci-diagnostic.txt
            git push origin ci-log --force || true
            echo "::error title=Integration tests failed::diagnostic published on tag ci-log"
            exit 1
          fi
