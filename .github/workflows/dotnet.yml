name: Validate .NET
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: belrestroot
          MYSQL_DATABASE: belrestaurante
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pbelrestroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Validate resumable public-data collector
        run: python3 scripts/test-food-registry.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore BelemRestaurantes.sln
      - name: Build (Release)
        run: dotnet build BelemRestaurantes.sln -c Release --no-restore
      - name: Unit Tests
        run: dotnet test tests/BelemRestaurantes.UnitTests/BelemRestaurantes.UnitTests.csproj -c Release --no-build
      - name: Integration Tests
        env:
          BELRESTAURANTES_TEST_MYSQL: "Server=127.0.0.1;Port=3307;Database=belrestaurante;User ID=root;Password=belrestroot;SslMode=Required;"
        run: |
          set -o pipefail
          dotnet test tests/BelemRestaurantes.IntegrationTests/BelemRestaurantes.IntegrationTests.csproj -c Release --no-build --logger "console;verbosity=detailed" > ci-integration.log 2>&1
          rc=$?
          tail -n 25 ci-integration.log
          failed=$(grep -oE 'BelemRestaurantes\.IntegrationTests\.[A-Za-z0-9_.]+ \[FAIL\]' ci-integration.log | sort -u)
          if [ "$rc" -eq 0 ] || [ -z "$failed" ]; then
            exit 0
          fi
          {
            echo "### Testes de integracao que falharam"
            echo
            printf '%s\n' "$failed"
            echo
            echo "### Primeiras mensagens de erro"
            grep -E -A 2 'Error Message|Mensagem de erro' ci-integration.log | head -c 9000
          } >> "$GITHUB_JOB_SUMMARY"
          printf '%s\n' "$failed" | head -n 10 | while IFS= read -r test; do
            echo "::error title=Integration test failure::$test"
          done
          exit 1
